name: Deploy to TEST (czw branch)

# 触发条件：czw 分支 push → 部署到 测试站点 test.51ppy.com
on:
  push:
    branches:
      - czw
    paths-ignore:
      - '**.md'
      - 'img/**'
  workflow_dispatch:

env:
  NODE_OPTIONS: --openssl-legacy-provider
  PHP_VERSION: '7.4'

jobs:
  build-and-deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ⚠️  测试环境无 Environment 审批闸门，全自动 (方便调试)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies (web/)
        working-directory: web
        run: npm ci || npm install

      - name: Build frontend Vue2 (web/dist)
        working-directory: web
        run: npm run build

      - name: Assemble release bundle
        id: assemble
        run: |
          set -e
          VERSION="$(date '+%Y%m%d_%H%M%S')_$(echo ${GITHUB_SHA} | cut -c1-7)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🧪 [TEST] Version: $VERSION"

          mkdir -p _release
          cp -a serve/. _release/
          cp -a web/dist/. _release/

          rm -rf _release/vendor _release/.env 2>/dev/null || true
          rm -rf _release/static/upload _release/static/file _release/static/backup 2>/dev/null || true

          tar -czf erp-release.tar.gz -C _release .
          du -h erp-release.tar.gz

      - name: Install SSH key (TEST)
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.TEST_DEPLOY_SSH_PRIVATE_KEY }}
          name: id_rsa
          known_hosts: unnecessary
          if_key_exists: fail

      - name: Upload tarball via scp (TEST)
        run: |
          set -e
          TARGET="${{ secrets.TEST_DEPLOY_SSH_USER }}@${{ secrets.TEST_DEPLOY_SSH_HOST }}:/tmp/erp-test-release.tar.gz"
          echo "📤 [TEST] Uploading to $TARGET ..."
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=30 \
              -P ${{ secrets.TEST_DEPLOY_SSH_PORT }} \
              erp-release.tar.gz "$TARGET"

      - name: Execute deploy on server (TEST, --env test)
        run: |
          set -e
          VERSION="${{ steps.assemble.outputs.version }}"
          DEPLOY_BASE="/opt/1panel/apps/openresty/openresty/www/sites/test.51ppy.com/erp-deploy"
          echo "🖥  [TEST] Deploying $VERSION with --env test ..."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=30 \
              -p ${{ secrets.TEST_DEPLOY_SSH_PORT }} \
              ${{ secrets.TEST_DEPLOY_SSH_USER }}@${{ secrets.TEST_DEPLOY_SSH_HOST }} \
              "bash $DEPLOY_BASE/deploy.sh --env test --tarball /tmp/erp-test-release.tar.gz deploy /tmp/erp-test-release.tar.gz $VERSION"

      - name: Health check (TEST)
        run: |
          set -e
          URL="${{ secrets.TEST_DEPLOY_HEALTHCHECK_URL }}"
          if [ -z "$URL" ]; then
            echo "⚠️  未配置 TEST_DEPLOY_HEALTHCHECK_URL，跳过检查"
            exit 0
          fi
          echo "🩺  [TEST] Health check: $URL"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 15 "$URL" || true)
            echo "   try $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ [TEST] Health check OK"
              exit 0
            fi
            sleep 10
          done
          echo "❌ [TEST] Health check FAILED"
          echo "   服务器上执行回滚: \$DEPLOY_BASE/deploy.sh --env test rollback"
          exit 1
