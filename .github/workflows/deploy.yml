name: Publish ERP production
on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: erp-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build release
        env:
          VUE_APP_API_BASE: http://erp.51ppy.com/
        run: bash scripts/build-release.sh
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/erp_deploy
          chmod 600 ~/.ssh/erp_deploy
          cp .github/production_known_hosts ~/.ssh/known_hosts
      - name: Upload and deploy
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH_ARGS=(-i "$HOME/.ssh/erp_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          scp "${SSH_ARGS[@]}" output/erp-release.tar.gz "root@150.158.128.208:/tmp/yterp-${RELEASE_SHA}.tar.gz"
          scp "${SSH_ARGS[@]}" scripts/deploy-production.sh "root@150.158.128.208:/tmp/yterp-${RELEASE_SHA}.sh"
          ssh "${SSH_ARGS[@]}" root@150.158.128.208 "bash /tmp/yterp-${RELEASE_SHA}.sh deploy ${RELEASE_SHA} /tmp/yterp-${RELEASE_SHA}.tar.gz"
